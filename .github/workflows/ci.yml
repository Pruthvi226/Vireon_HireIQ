name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip==26.2.1
      - run: pip install -r requirements.txt pytest pytest-cov
      - run: pip install -r requirements-security.txt
      - run: pip-audit --progress-spinner off --format json -o python-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: python-audit-report
          path: backend/python-audit.json
      - run: python -m compileall app auth
      - run: pytest --cov=app --cov=auth --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --json > npm-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit.json
      - run: npm run build
      - run: npm test -- --run

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_SECRET_KEY: test-compose-secret-with-more-than-32-characters
      POSTGRES_PASSWORD: test-postgres-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t vireon-hireiq-backend:ci -f backend/Dockerfile backend
      - run: docker build -t vireon-hireiq-frontend:ci -f frontend/Dockerfile frontend
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml build
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --no-deps backend
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --no-deps frontend
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
        if: always()
      - name: Scan backend image
        id: scan-backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vireon-hireiq-backend:ci
          format: json
          output: trivy-backend.json
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
      - name: Scan frontend image
        if: ${{ !cancelled() && steps.scan-backend.outcome != 'skipped' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vireon-hireiq-frontend:ci
          format: json
          output: trivy-frontend.json
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
      - name: Upload image vulnerability reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-vulnerability-reports
          path: trivy-*.json
