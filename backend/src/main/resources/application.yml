server:
  port: 8080

spring:
  application:
    name: ai-interview-coach-backend
  # Safe local default: H2 in-memory (profile `dev`). Use profile `mysql` for MySQL.
  profiles:
    default: dev
  jpa:
    open-in-view: false

app:
  jwt:
    issuer: ai-interview-coach
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
    accessTokenTtlSeconds: 3600
  cors:
    allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  aiService:
    baseUrl: ${AI_SERVICE_BASE_URL:http://localhost:8000}

logging:
  level:
    org.springframework.security: INFO
