# In-memory H2 — active by default (spring.profiles.default=dev).
spring:
  datasource:
    url: jdbc:h2:mem:ai_interview_coach;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
