name: vireon-hireiq

services:
  backend:
    build: ./backend
    container_name: vireon-hireiq-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      VIREON_DATA_DIR: /app/storage
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-replace-with-a-long-random-secret-before-production}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      VIREON_CACHE_TTL_SECONDS: ${VIREON_CACHE_TTL_SECONDS:-60}
      VIREON_RATE_LIMIT_PER_MINUTE: ${VIREON_RATE_LIMIT_PER_MINUTE:-240}
      VIREON_SQLITE_JOURNAL_MODE: ${VIREON_SQLITE_JOURNAL_MODE:-WAL}
      MAX_RESUME_BYTES: ${MAX_RESUME_BYTES:-5242880}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    volumes:
      - vireon_data:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: vireon-hireiq-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  vireon_data:
