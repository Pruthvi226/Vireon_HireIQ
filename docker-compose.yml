version: "3.9"

services:
  backend:
    build: ./backend
    container_name: vireon-hireiq-api
    environment:
      VIREON_DATA_DIR: /app/storage
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - vireon_data:/app/storage

volumes:
  vireon_data:
