name: vireon-hireiq

services:
  backend:
    build: ./backend
    container_name: vireon-hireiq-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      VIREON_DATA_DIR: /app/storage
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be supplied in .env or the environment}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
      VIREON_CACHE_TTL_SECONDS: ${VIREON_CACHE_TTL_SECONDS:-60}
      VIREON_RATE_LIMIT_PER_MINUTE: ${VIREON_RATE_LIMIT_PER_MINUTE:-240}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      VIREON_SQLITE_JOURNAL_MODE: ${VIREON_SQLITE_JOURNAL_MODE:-WAL}
      MAX_RESUME_BYTES: ${MAX_RESUME_BYTES:-5242880}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vireon_data:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: vireon-hireiq-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    profiles: [production]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vireon}
      POSTGRES_USER: ${POSTGRES_USER:-vireon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: [production]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  vireon_data:
  postgres_data:
  redis_data:
